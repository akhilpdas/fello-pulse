openapi: 3.1.0
info:
  title: Pulse
  version: 0.1.0
paths:
  /auth/login:
    post:
      summary: Login
      operationId: login_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/me:
    get:
      summary: Me
      operationId: me_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /auth/logout:
    post:
      summary: Logout
      operationId: logout_auth_logout_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /queue:
    get:
      summary: Get Queue
      operationId: get_queue_queue_get
      parameters:
      - name: as_of
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: As Of
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /queue/snapshots:
    get:
      summary: Get Queue Snapshots
      description: 'The days a queue exists for, newest first, with how many of the
        caller''s accounts were scored. The worker cycles

        every 15 minutes, so a day holds many snapshots; one entry per (UTC) day --
        the day''s last -- keeps the picker usable.'
      operationId: get_queue_snapshots_queue_snapshots_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /queue/all:
    get:
      summary: Get Queue All
      description: 'The same ranking as ``/queue`` without the capacity cut: paginated
        and filterable. ``rank`` is the account''s

        position in the full ranking (so it is stable under filtering and paging);
        ``in_queue`` says whether it is inside

        this week''s capacity.'
      operationId: get_queue_all_queue_all_get
      parameters:
      - name: as_of
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: As Of
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 50
          title: Limit
      - name: tier
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Tier
      - name: driver
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Driver
      - name: q
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Q
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /queue/low-confidence:
    get:
      summary: Get Low Confidence
      description: 'Accounts the system declined to score (SC-012): their own surface,
        with the

        machine-readable reason and a human remedy, never folded into the ranked queue.'
      operationId: get_low_confidence_queue_low_confidence_get
      parameters:
      - name: as_of
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: As Of
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /accounts/{account_id}:
    get:
      summary: Get Account
      operationId: get_account_accounts__account_id__get
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Account Id
      - name: as_of
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: As Of
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /accounts/{account_id}/evidence:
    get:
      summary: Get Evidence
      description: 'Resolve evidence ids to the original source records. Scoped to
        the

        account so one account''s evidence can never be used to pull another''s.'
      operationId: get_evidence_accounts__account_id__evidence_get
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Account Id
      - name: event_ids
        in: query
        required: true
        schema:
          type: array
          items:
            type: integer
          title: Event Ids
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /accounts/{account_id}/score-diff:
    get:
      summary: Score Diff
      description: 'Feature-level diff between two scores, with the per-feature

        contribution change -- "why did this move," answerable without a data

        pull (FR-027).'
      operationId: score_diff_accounts__account_id__score_diff_get
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Account Id
      - name: from_as_of
        in: query
        required: true
        schema:
          type: string
          format: date-time
          title: From As Of
      - name: to_as_of
        in: query
        required: true
        schema:
          type: string
          format: date-time
          title: To As Of
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /actions:
    get:
      summary: List Actions
      operationId: list_actions_actions_get
      parameters:
      - name: state
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: State
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /actions/{action_id}/approve:
    post:
      summary: Approve Action
      description: 'Approve a draft and deliver it -- once. The claim below is a single
        conditional UPDATE, so of two

        simultaneous approvals exactly one wins and sends; the other returns the winner''s
        result. States in

        which the message may already have left (sent, send_unconfirmed) are never
        claimed again.'
      operationId: approve_action_actions__action_id__approve_post
      parameters:
      - name: action_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Action Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /actions/{action_id}/reject:
    post:
      summary: Reject Action
      operationId: reject_action_actions__action_id__reject_post
      parameters:
      - name: action_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Action Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /actions/{action_id}:
    patch:
      summary: Edit Action
      operationId: edit_action_actions__action_id__patch
      parameters:
      - name: action_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Action Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/config:
    get:
      summary: Get Config
      operationId: get_config_admin_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
    patch:
      summary: Patch Config
      operationId: patch_config_admin_config_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigPatch'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/allowlist:
    get:
      summary: Get Allowlist
      operationId: get_allowlist_admin_allowlist_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /admin/allowlist/{play_key}:
    put:
      summary: Put Allowlist
      operationId: put_allowlist_admin_allowlist__play_key__put
      parameters:
      - name: play_key
        in: path
        required: true
        schema:
          type: string
          title: Play Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AllowlistPut'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/coverage:
    get:
      summary: Get Coverage
      description: 'FR-012: per source, whether it is connected and what has actually
        landed.

        A source that is not connected reports zero events and no timestamp -- it
        is

        absent, which is different from connected-and-silent.'
      operationId: get_coverage_admin_coverage_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /admin/outbound:
    get:
      summary: Get Outbound
      operationId: get_outbound_admin_outbound_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
    patch:
      summary: Patch Outbound
      operationId: patch_outbound_admin_outbound_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OutboundPatch'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/opt-outs:
    get:
      summary: List Opt Outs
      operationId: list_opt_outs_admin_opt_outs_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
    post:
      summary: Add Opt Out
      operationId: add_opt_out_admin_opt_outs_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OptOutCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/opt-outs/{opt_out_id}:
    delete:
      summary: Remove Opt Out
      operationId: remove_opt_out_admin_opt_outs__opt_out_id__delete
      parameters:
      - name: opt_out_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Opt Out Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /model:
    get:
      summary: Get Model Report
      operationId: get_model_report_model_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /runs:
    get:
      summary: List Runs
      operationId: list_runs_runs_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 50
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /accounts/{account_id}/feedback:
    post:
      summary: Post Feedback
      operationId: post_feedback_accounts__account_id__feedback_post
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Account Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /accounts/{account_id}/suppress:
    post:
      summary: Suppress Account
      operationId: suppress_account_accounts__account_id__suppress_post
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Account Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuppressRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      summary: Lift Suppression
      description: Ends every active suppression now. The rows are kept (expiry set
        to now), not deleted.
      operationId: lift_suppression_accounts__account_id__suppress_delete
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Account Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/users:
    get:
      summary: List Users
      operationId: list_users_admin_users_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
    post:
      summary: Create User
      operationId: create_user_admin_users_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/users/{user_id}:
    patch:
      summary: Patch User
      operationId: patch_user_admin_users__user_id__patch
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: User Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /admin/audit:
    get:
      summary: Get Audit
      operationId: get_audit_admin_audit_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /admin/accounts/{account_id}:
    patch:
      summary: Assign Owner
      operationId: assign_owner_admin_accounts__account_id__patch
      parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Account Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnerPatch'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AllowlistPut:
      properties:
        auto_send:
          type: boolean
          title: Auto Send
      type: object
      required:
      - auto_send
      title: AllowlistPut
    ApproveRequest:
      properties: {}
      type: object
      title: ApproveRequest
    ConfigPatch:
      properties:
        horizon_days:
          anyOf:
          - type: integer
          - type: 'null'
          title: Horizon Days
        contraction_threshold:
          anyOf:
          - type: number
          - type: 'null'
          title: Contraction Threshold
        weekly_capacity:
          anyOf:
          - type: integer
          - type: 'null'
          title: Weekly Capacity
        tier_red_at:
          anyOf:
          - type: number
          - type: 'null'
          title: Tier Red At
        tier_amber_at:
          anyOf:
          - type: number
          - type: 'null'
          title: Tier Amber At
        min_days_history:
          anyOf:
          - type: integer
          - type: 'null'
          title: Min Days History
        min_sources_with_data:
          anyOf:
          - type: integer
          - type: 'null'
          title: Min Sources With Data
        suppression_days:
          anyOf:
          - type: integer
          - type: 'null'
          title: Suppression Days
        max_sends_per_cycle:
          anyOf:
          - type: integer
          - type: 'null'
          title: Max Sends Per Cycle
        material_delta:
          anyOf:
          - type: number
          - type: 'null'
          title: Material Delta
      additionalProperties: false
      type: object
      title: ConfigPatch
    EditRequest:
      properties:
        subject:
          anyOf:
          - type: string
          - type: 'null'
          title: Subject
        body:
          anyOf:
          - type: string
          - type: 'null'
          title: Body
      type: object
      title: EditRequest
    FeedbackRequest:
      properties:
        kind:
          type: string
          enum:
          - false_positive
          - true_positive
          - not_actionable
          title: Kind
        note:
          anyOf:
          - type: string
          - type: 'null'
          title: Note
      additionalProperties: false
      type: object
      required:
      - kind
      title: FeedbackRequest
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    LoginRequest:
      properties:
        workspace:
          type: string
          title: Workspace
        email:
          type: string
          title: Email
        password:
          type: string
          title: Password
      additionalProperties: false
      type: object
      required:
      - workspace
      - email
      - password
      title: LoginRequest
    OptOutCreate:
      properties:
        email:
          type: string
          title: Email
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
      additionalProperties: false
      type: object
      required:
      - email
      title: OptOutCreate
    OutboundPatch:
      properties:
        outbound_enabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Outbound Enabled
        sender_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Sender Address
        sender_verified:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Sender Verified
        demo_mode:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Demo Mode
        test_inbox:
          anyOf:
          - type: string
          - type: 'null'
          title: Test Inbox
      additionalProperties: false
      type: object
      title: OutboundPatch
    OwnerPatch:
      properties:
        owner_user_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Owner User Id
      additionalProperties: false
      type: object
      required:
      - owner_user_id
      title: OwnerPatch
    RejectRequest:
      properties:
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
      type: object
      title: RejectRequest
    SuppressRequest:
      properties:
        reason:
          type: string
          title: Reason
        expires_at:
          type: string
          format: date-time
          title: Expires At
      additionalProperties: false
      type: object
      required:
      - reason
      - expires_at
      title: SuppressRequest
    UserCreate:
      properties:
        email:
          type: string
          title: Email
        name:
          type: string
          title: Name
        role:
          type: string
          enum:
          - csm
          - operator
          title: Role
        password:
          type: string
          title: Password
      additionalProperties: false
      type: object
      required:
      - email
      - name
      - role
      - password
      title: UserCreate
    UserPatch:
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          title: Name
        role:
          anyOf:
          - type: string
            enum:
            - csm
            - operator
          - type: 'null'
          title: Role
        disabled:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Disabled
        password:
          anyOf:
          - type: string
          - type: 'null'
          title: Password
      additionalProperties: false
      type: object
      title: UserPatch
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
